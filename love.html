<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>เราคบกัน 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;600&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Kanit',sans-serif;
    background:linear-gradient(180deg,#fff0f5,#ffe6f0);
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
}

.card{
    background:white;
    padding:30px;
    border-radius:25px;
    text-align:center;
    box-shadow:0 10px 25px rgba(255,105,135,0.25);
    max-width:420px;
    width:90%;
}

.card img{
    width:220px;
    border-radius:20px;
    margin:15px 0;
}

h2{
    color:#ff4f8b;
}

h3{
    color:#666;
    margin-bottom:15px;
    font-weight:400;
}

#time{
    color:#ff4f8b;
    font-size:22px;
    font-weight:600;
    line-height:1.8;
}
</style>
</head>

<body>

<img src="cat-normal.png" 
     onmouseover="this.src='cat-open.png';" 
     onmouseout="this.src='cat-normal.png';" 
     onclick="history.back();" 
     alt="กลับหน้าก่อนหน้า" 
     style="position: fixed; bottom: 20px; left: 20px; width: 70px; height: auto; cursor: pointer; z-index: 1000;" />

<div class="card">
    <h2>💖 เราคบกันมาแล้ว 💖</h2>

    <img src="img/fan.png" alt="รูปคู่">

    <h3>25 ตุลาคม 2025</h3>

    <div id="time"></div>
</div>

<script>
const startDate = new Date("2025-10-25T00:00:00");

function updateTime() {
    const now = new Date();

    let years = now.getFullYear() - startDate.getFullYear();
    let months = now.getMonth() - startDate.getMonth();
    let days = now.getDate() - startDate.getDate();

    if (days < 0) {
        months--;

        const daysInPrevMonth = new Date(
            now.getFullYear(),
            now.getMonth(),
            0
        ).getDate();

        days += daysInPrevMonth;
    }

    if (months < 0) {
        years--;
        months += 12;
    }

    const diff = now - startDate;

    const hours = Math.floor(diff / (1000 * 60 * 60)) % 24;
    const minutes = Math.floor(diff / (1000 * 60)) % 60;
    const seconds = Math.floor(diff / 1000) % 60;

    document.getElementById("time").innerHTML =
        `💞 ${years} ปี ${months} เดือน ${days} วัน<br>
        ⏰ ${hours} ชั่วโมง ${minutes} นาที ${seconds} วินาที ❤️`;
}

updateTime();
setInterval(updateTime, 1000);
</script>

</body>
</html>
